[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "ropemetrics"
version     = "0.1.0"
description = "Framework-agnostic jump rope counter powered by pose estimation."
readme      = "README.md"
license     = { file = "LICENSE" }
authors     = [{ name = "Kangsungmin", email = "beloksm@gmail.com" }]
keywords    = [
    "jump-rope", "pose-estimation", "mediapipe", "repetition-counting",
    "sports-analytics", "computer-vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.10"
dependencies    = ["numpy>=1.26"]

[project.optional-dependencies]
mediapipe = ["mediapipe>=0.10.30"]
movenet   = ["tensorflow>=2.13"]
dev       = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.urls]
Homepage    = "https://github.com/Kangsungmin/ropemetrics"
Repository  = "https://github.com/Kangsungmin/ropemetrics"
"Bug Tracker" = "https://github.com/Kangsungmin/ropemetrics/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
